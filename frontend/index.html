<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MutiaraConnect</title>
  <!-- Unbounded: the display face for "Mutiara Line" in the home headline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved theme before first paint so dark mode doesn't flash light.
    try {
      var saved = localStorage.getItem("mutiaraconnect.theme");
      var dark = saved === "dark";
      if (dark) document.documentElement.classList.add("dark");
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
